<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Facescan // Face Login{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-mark">◈</span> Facescan
    <span class="brand-sub">FACE-AUTH</span>
  </a>
  <nav class="topnav">
    {% if user %}
      <span class="nav-user">{{ user }}</span>
      <a href="{{ url_for('logout') }}" class="nav-link">Sign out</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="nav-link">Sign in</a>
      <a href="{{ url_for('register') }}" class="nav-link nav-link--accent">Enroll</a>
    {% endif %}
  </nav>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>Local demo &mdash; biometric templates never leave this server.</span>
</footer>
</body>
</html>
