{% extends "base.html" %}
{% block title %}Sign in &mdash; Facescan{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <p class="eyebrow">STEP 1 OF 2</p>
    <h1>Sign in</h1>
    <p class="lede">Enter your password, then verify with your face.</p>

    {% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}

    <form method="POST" class="form" autocomplete="off">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" required placeholder="Your username" autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required placeholder="Your password">
      </label>
      <button type="submit" class="btn btn--primary btn--block">Continue to face verification &rarr;</button>
    </form>
    <p class="switch">No account? <a href="{{ url_for('register') }}">Enroll</a></p>
  </div>
</section>
{% endblock %}
